name: Daily Technology Digest

on:
  schedule:
    # 6h00 UTC = 7h00 Paris (hiver) / 8h00 Paris (été)
    - cron: '0 6 * * *'
  workflow_dispatch: # déclenchement manuel pour les tests

jobs:
  digest:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up JDK 22
        uses: actions/setup-java@v5
        with:
          java-version: '22'
          distribution: 'temurin'

      - name: Cache Gradle
        uses: actions/cache@v5
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle.kts', 'gradle/libs.versions.toml') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: Build fat JAR
        run: ./gradlew :bootstrap:shadowJar --no-daemon

      - name: Run digest
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          SMTP_USERNAME:     ${{ secrets.SMTP_USERNAME }}
          SMTP_PASSWORD:     ${{ secrets.SMTP_PASSWORD }}
          DIGEST_RECIPIENT:  ${{ secrets.DIGEST_RECIPIENT }}
          # Optionnels (valeurs par défaut dans Main.kt si absents)
          # SMTP_HOST: smtp.gmail.com
          # SMTP_PORT: "587"
          # SMTP_FROM: identique à SMTP_USERNAME
        run: java -jar bootstrap/build/libs/technology-watch-system.jar
